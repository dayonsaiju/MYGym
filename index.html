<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; connect-src 'self' https://generativelanguage.googleapis.com https://api.openai.com https://api.groq.com https://openrouter.ai https://api.deepseek.com https://api.together.xyz;">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="description" content="MyGyM - Minimalist Offline-First Progressive Web App for Weightlifting">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyGyM">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="stylesheet" href="./style.css?v=6.2.0">
  <title>MyGyM</title>
  <script>
    // Self-healing force cache clear & auto-reload for iOS Safari PWA
    (function() {
      var SHELL_VERSION = 'mygym-core-v6.2.0-nutrition';
      var cachedVersion = null;
      try { cachedVersion = localStorage.getItem('mygym_shell_version'); } catch(_) {}
      if (cachedVersion !== SHELL_VERSION) {
        // Active workout reload guard: never reload while workout is in progress
        var isWorkoutActive = false;
        try {
          var actData = localStorage.getItem('lift_act') || localStorage.getItem('act');
          if (actData && actData !== 'null' && JSON.parse(actData)) isWorkoutActive = true;
        } catch(_) {}
        if (isWorkoutActive) return;

        // Anti-reload loop protection using sessionStorage
        var reloadAttempts = 0;
        try { reloadAttempts = parseInt(sessionStorage.getItem('mygym_reload_attempts') || '0', 10); } catch(_) {}
        if (reloadAttempts >= 1) {
          try { sessionStorage.removeItem('mygym_reload_attempts'); } catch(_) {}
          try { localStorage.setItem('mygym_shell_version', SHELL_VERSION); } catch(_) {}
          return;
        }
        try { sessionStorage.setItem('mygym_reload_attempts', String(reloadAttempts + 1)); } catch(_) {}

        if ('caches' in window) {
          caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }).then(function() {
            try { localStorage.setItem('mygym_shell_version', SHELL_VERSION); } catch(_) {}
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) {
                  regs[i].unregister();
                }
              });
            }
            if (cachedVersion) {
              window.location.href = window.location.origin + window.location.pathname + '?t=' + Date.now();
            }
          }).catch(function() {
            try { localStorage.setItem('mygym_shell_version', SHELL_VERSION); } catch(_) {}
          });
        } else {
          try { localStorage.setItem('mygym_shell_version', SHELL_VERSION); } catch(_) {}
        }
      } else {
        try { sessionStorage.removeItem('mygym_reload_attempts'); } catch(_) {}
      }
    })();
  </script>
</head>
<body>
  <main id="v"></main>
  <div id="rest" hidden>
    <div class="rest-ring-wrap">
      <svg class="rest-ring-svg" width="38" height="38" viewBox="0 0 38 38">
        <circle class="rest-ring-bg" cx="19" cy="19" r="15"/>
        <circle class="rest-ring-fill" id="rest-ring-fill" cx="19" cy="19" r="15"/>
      </svg>
      <span class="rest-ring-icon">⏱️</span>
    </div>
    <div class="rest-text-col">
      <span>Rest</span>
      <b>0:00</b>
    </div>
    <button data-a="r15">+15s</button>
    <button data-a="rskip">Skip</button>
  </div>
  <div id="toast"></div>
  <div id="m" hidden></div>
  <nav id="tabs"></nav>
  <script src="./calc.js?v=6.2.0"></script>
  <script type="module" src="./app.js?v=6.2.0"></script>
</body>
</html>
