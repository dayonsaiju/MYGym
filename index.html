<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; connect-src 'self';">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="description" content="MyGyM - Minimalist Offline-First Progressive Web App for Weightlifting">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyGyM">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="stylesheet" href="./style.css?v=5.6.1">
  <title>MyGyM</title>
  <script>
    // Self-healing force cache clear & auto-reload for iOS Safari PWA
    (function() {
      var SHELL_VERSION = 'mygym-core-v5.6.1-persist';
      var cachedVersion = localStorage.getItem('mygym_shell_version');
      if (cachedVersion !== SHELL_VERSION) {
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }).then(function() {
            localStorage.setItem('mygym_shell_version', SHELL_VERSION);
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) {
                  regs[i].unregister();
                }
              });
            }
            if (cachedVersion) {
              window.location.href = window.location.origin + window.location.pathname + '?t=' + Date.now();
            }
          });
        } else {
          localStorage.setItem('mygym_shell_version', SHELL_VERSION);
        }
      }
    })();
  </script>
</head>
<body>
  <main id="v"></main>
  <div id="rest" hidden>
    <div class="rest-ring-wrap">
      <svg class="rest-ring-svg" width="38" height="38" viewBox="0 0 38 38">
        <circle class="rest-ring-bg" cx="19" cy="19" r="15"/>
        <circle class="rest-ring-fill" id="rest-ring-fill" cx="19" cy="19" r="15"/>
      </svg>
      <span class="rest-ring-icon">⏱️</span>
    </div>
    <div class="rest-text-col">
      <span>Rest</span>
      <b>0:00</b>
    </div>
    <button data-a="r15">+15s</button>
    <button data-a="rskip">Skip</button>
  </div>
  <div id="toast"></div>
  <div id="m" hidden></div>
  <nav id="tabs"></nav>
  <script type="module" src="./app.js?v=5.6.1"></script>
</body>
</html>
