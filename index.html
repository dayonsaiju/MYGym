<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; connect-src 'self' https://generativelanguage.googleapis.com https://api.openai.com https://api.groq.com https://openrouter.ai https://api.deepseek.com https://api.together.xyz; object-src 'none'; base-uri 'none';">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="description" content="MyGyM - Minimalist Offline-First Progressive Web App for Weightlifting">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyGyM">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="stylesheet" href="./style.css?v=7.0.5">
  <title>MyGyM</title>
  <script src="./shell.js?v=7.0.5"></script>
</head>
<body>
  <main id="v"></main>
  <div id="rest" hidden>
    <div class="rest-ring-wrap">
      <svg class="rest-ring-svg" width="38" height="38" viewBox="0 0 38 38">
        <circle class="rest-ring-bg" cx="19" cy="19" r="15"/>
        <circle class="rest-ring-fill" id="rest-ring-fill" cx="19" cy="19" r="15"/>
      </svg>
      <span class="rest-ring-icon" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="2" x2="14" y2="2"/><line x1="12" y1="14" x2="15" y2="11"/><circle cx="12" cy="14" r="8"/></svg></span>
    </div>
    <div class="rest-text-col">
      <span>Rest</span>
      <b>0:00</b>
    </div>
    <button data-a="r15">+15s</button>
    <button data-a="rskip">Skip</button>
  </div>
  <div id="toast"></div>
  <div id="m" hidden></div>
  <nav id="tabs"></nav>
  <script src="./calc.js?v=7.0.5"></script>
  <script src="./ai-config.js?v=7.0.5"></script>
  <script type="module" src="./app.js?v=7.0.5"></script>
</body>
</html>
